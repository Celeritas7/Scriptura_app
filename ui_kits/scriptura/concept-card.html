<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scriptura — Concept card prototype</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-ui);
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  a { color: var(--accent-quiz); } a:hover { color: var(--accent-quiz-deep); }
  @keyframes cc-pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* chrome breakpoints are CSS-only: resolved at layout, no JS callback needed */
  .cc-flex-desktop { display: flex; } .cc-inline-desktop { display: inline; }
  .cc-flex-mobile { display: none; }
  .cc-bar { gap: var(--space-5); padding: var(--space-4) var(--space-6); flex-wrap: wrap; }
  .cc-content { padding: var(--space-7) var(--space-6) var(--space-9); }
  .cc-streak { padding: 0.4rem 0.85rem; }
  @media (max-width: 700px) {
    .cc-flex-desktop, .cc-inline-desktop { display: none; }
    .cc-flex-mobile { display: flex; }
    .cc-bar { gap: var(--space-3); padding: var(--space-3) var(--space-4); flex-wrap: nowrap; }
    .cc-content { padding: var(--space-5) var(--space-4) calc(70px + var(--space-6)); }
    .cc-streak { padding: 0.4rem 0.6rem; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { Card, Button } = window.ScripturaDesignSystem_72b484;
const TAM = 'var(--font-tamil)', DEV = 'var(--font-devanagari)';
const ACCENT = 'quiz', ACC = 'var(--accent-quiz)';

const POSITIONS = [
  { id:'initial', tab:'Start of word', sound:'k', ipa:'/k/', rule:'Word-initial க is always a hard k.',
    parts:[{t:'க',hi:1},{t:'டல்'}], roman:[{t:'ka',hi:1},{t:'dal'}], mean:'sea' },
  { id:'double', tab:'Doubled', sound:'k', ipa:'/k/', rule:'Doubled க்க stays hard — this is how Tamil writes a real k between vowels.',
    parts:[{t:'ப'},{t:'க்க',hi:1},{t:'ம்'}], roman:[{t:'pa'},{t:'kka',hi:1},{t:'m'}], mean:'page, side' },
  { id:'medial', tab:'Between vowels', sound:'g', ipa:'/ɣ~g/', rule:'A single க between two vowels softens to g — in some words closer to h.',
    parts:[{t:'ம'},{t:'க',hi:1},{t:'ன்'}], roman:[{t:'ma'},{t:'ga',hi:1},{t:'n'}], mean:'son' },
  { id:'nasal', tab:'After ங', sound:'g', ipa:'/ŋg/', rule:'After its own nasal ங, க voices to g.',
    parts:[{t:'தங்'},{t:'க',hi:1},{t:'ம்'}], roman:[{t:'tha'},{t:'nga',hi:1},{t:'m'}], mean:'gold' },
];

function Seg({ parts, font, size, weight }) {
  return (
    <span style={{ fontFamily: font, fontSize: size, fontWeight: weight, lineHeight: 1.35 }}>
      {parts.map((p, i) => (
        <span key={i} style={{ color: p.hi ? ACC : 'var(--text-primary)' }}>{p.t}</span>
      ))}
    </span>
  );
}

function ConceptCard({ onDone }) {
  const [sel, setSel] = React.useState(0);
  const p = POSITIONS[sel];
  return (
    <Card style={{ display:'flex', flexDirection:'column', gap:'var(--space-6)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:'var(--space-4)', flexWrap:'wrap' }}>
        <span style={{ fontSize:'var(--fs-micro)', textTransform:'uppercase', letterSpacing:'var(--tracking-tight)', fontWeight:700,
                       padding:'0.3rem 0.8rem', borderRadius:'var(--radius-pill)', background:'var(--bg-secondary)',
                       border:`1px solid ${ACC}`, color:ACC, whiteSpace:'nowrap', flexShrink:0 }}>Concept · not drilled</span>
        <span style={{ fontSize:'var(--fs-hint)', color:'var(--text-muted)' }}>Read once before Vallinam</span>
      </div>

      <div>
        <div style={{ fontSize:'var(--fs-h2)', fontWeight:700, textWrap:'pretty' }}>One letter, two sounds</div>
        <div style={{ fontSize:'var(--fs-body)', color:'var(--text-secondary)', marginTop:4, textWrap:'pretty' }}>
          Tamil doesn't spell the difference between <i>k</i> and <i>g</i> — where the letter sits in the word decides it.
        </div>
      </div>

      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'var(--space-8)', flexWrap:'wrap',
                    padding:'var(--space-6) 0', borderTop:'1px solid var(--border-color)', borderBottom:'1px solid var(--border-color)' }}>
        <div style={{ fontFamily:TAM, fontSize:'6.5rem', lineHeight:1, color:ACC }}>க</div>
        <div key={p.id} style={{ animation:'cc-pop var(--dur-base) var(--ease)', minWidth:0 }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:'var(--space-3)' }}>
            <span style={{ fontSize:'3rem', fontWeight:700, color:ACC }}>{p.sound}</span>
            <span style={{ fontSize:'var(--fs-lg)', color:'var(--text-muted)' }}>{p.ipa}</span>
          </div>
          <div style={{ fontSize:'var(--fs-small)', color:'var(--text-secondary)', maxWidth:290, textWrap:'pretty' }}>{p.rule}</div>
        </div>
      </div>

      <div style={{ display:'flex', gap:'var(--space-3)', flexWrap:'wrap', justifyContent:'center' }}>
        {POSITIONS.map((q, i) => (
          <button key={q.id} type="button" onClick={() => setSel(i)}
            style={{ cursor:'pointer', fontFamily:'var(--font-ui)', fontSize:'var(--fs-small)', padding:'0.45rem 0.95rem',
                     borderRadius:'var(--radius-pill)', transition:'all var(--dur-fast) var(--ease)', whiteSpace:'nowrap',
                     background: i===sel ? 'linear-gradient(135deg, var(--accent-quiz), var(--accent-quiz-deep))' : 'var(--bg-secondary)',
                     color: i===sel ? 'var(--text-on-accent)' : 'var(--text-primary)',
                     border:`1px solid ${i===sel ? 'transparent' : 'var(--border-color)'}`,
                     boxShadow: i===sel ? 'var(--glow-quiz)' : 'none' }}>{q.tab}</button>
        ))}
      </div>

      <div key={p.id+'w'} style={{ textAlign:'center', padding:'var(--space-6)', borderRadius:'var(--radius-lg)',
                    background:'var(--bg-secondary)', border:'1px solid var(--border-color)', animation:'cc-pop var(--dur-base) var(--ease)' }}>
        <Seg parts={p.parts} font={TAM} size="3.2rem" weight={600} />
        <div style={{ marginTop:'var(--space-3)' }}><Seg parts={p.roman} font="var(--font-ui)" size="var(--fs-lg)" weight={600} /></div>
        <div style={{ fontSize:'var(--fs-small)', color:'var(--text-muted)', fontStyle:'italic', marginTop:2 }}>“{p.mean}”</div>
      </div>

      <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'var(--space-5)', flexWrap:'wrap',
                    padding:'var(--space-5)', borderRadius:'var(--radius-lg)', border:'1px dashed var(--border-color)' }}>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontFamily:DEV, fontSize:'2rem', color:'var(--text-secondary)', letterSpacing:'0.1em' }}>क ख ग घ</div>
          <div style={{ fontSize:'var(--fs-micro)', textTransform:'uppercase', letterSpacing:'var(--tracking-tight)', color:'var(--text-muted)' }}>Hindi · 4 letters</div>
        </div>
        <div style={{ fontSize:'1.5rem', color:'var(--text-muted)' }}>→</div>
        <div style={{ textAlign:'center' }}>
          <div style={{ fontFamily:TAM, fontSize:'2rem', color:ACC }}>க</div>
          <div style={{ fontSize:'var(--fs-micro)', textTransform:'uppercase', letterSpacing:'var(--tracking-tight)', color:'var(--text-muted)' }}>Tamil · 1 letter</div>
        </div>
        <div style={{ flex:'1 1 220px', minWidth:0, fontSize:'var(--fs-small)', color:'var(--text-secondary)', textWrap:'pretty' }}>
          Tamil has no aspirates and no separate voiced stops, so there was never a <i>kha</i> or <i>gha</i> to spell. The same holds for ச · ட · த · ப.
        </div>
      </div>

      <div style={{ display:'flex', justifyContent:'center' }}>
        <Button accent={ACCENT} onClick={onDone}>Got it — start Vallinam →</Button>
      </div>
    </Card>
  );
}

function Lesson() {
  const steps = ['concept','learn','trace','quiz'];
  const [done, setDone] = React.useState(false);
  const step = done ? 'learn' : 'concept';
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:'var(--space-6)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:'var(--space-5)' }}>
        <button type="button" aria-label="Exit lesson"
          style={{ background:'var(--bg-card)', border:'1px solid var(--border-color)', color:'var(--text-primary)',
                   width:40, height:40, borderRadius:'var(--radius-full)', cursor:'pointer', fontSize:'1.1rem', flexShrink:0 }}>✕</button>
        <div style={{ flex:1, height:12, borderRadius:'var(--radius-full)', background:'var(--bg-secondary)',
                      border:'1px solid var(--border-color)', overflow:'hidden' }}>
          <div style={{ height:'100%', width: done ? '6%' : '0%', background:ACC, borderRadius:'var(--radius-full)',
                        transition:'width var(--dur-base) var(--ease)' }} />
        </div>
        <span style={{ fontSize:'var(--fs-small)', color:'var(--text-secondary)', flexShrink:0 }}>{done ? '1/6' : '—'}</span>
      </div>
      <div style={{ display:'flex', gap:'var(--space-3)', justifyContent:'center' }}>
        {steps.map((s) => (
          <span key={s} style={{ fontSize:'var(--fs-micro)', textTransform:'uppercase', letterSpacing:'var(--tracking-tight)',
            padding:'0.3rem 0.9rem', borderRadius:'var(--radius-pill)', transition:'all var(--dur-fast) var(--ease)',
            background: s === step ? ACC : 'var(--bg-secondary)',
            color: s === step ? 'var(--text-on-accent)' : 'var(--text-muted)' }}>{s}</span>
        ))}
      </div>
      {!done ? <ConceptCard onDone={() => setDone(true)} /> : (
        <Card style={{ textAlign:'center', padding:'var(--space-9) var(--space-7)' }}>
          <div style={{ fontFamily:TAM, fontSize:'4rem', color:ACC, lineHeight:1 }}>க</div>
          <div style={{ marginTop:'var(--space-4)', color:'var(--text-secondary)' }}>…and the normal Learn → Trace → Quiz loop takes over from here.</div>
          <div style={{ marginTop:'var(--space-6)' }}><Button variant="secondary" onClick={() => setDone(false)}>↻ Replay concept card</Button></div>
        </Card>
      )}
    </div>
  );
}

const THEMES = {
  midnight: { icon: '🌙', label: 'Midnight', vars: {} },
  dusk: { icon: '🌆', label: 'Dusk', vars: {
    '--bg-primary': '#13131b', '--bg-secondary': '#1c1c28', '--bg-card': '#242433',
    '--bg-elevated': '#2e2e40', '--border-color': '#34344a' } },
  daylight: { icon: '☀️', label: 'Daylight', vars: {
    '--bg-primary': '#f1f2f7', '--bg-secondary': '#ffffff', '--bg-card': '#ffffff',
    '--bg-elevated': '#eceef5', '--border-color': '#e2e3ee',
    '--text-primary': '#1a1a25', '--text-secondary': '#5a5a72', '--text-muted': '#9a9ab0',
    '--shadow-card': '0 4px 18px rgba(20,20,40,0.10)' } },
};

function App() {
  const [theme, setTheme] = React.useState('midnight');

  const navItems = [
    { id: 'home', label: 'Home', icon: '🏠' },
    { id: 'path', label: 'Path', icon: '🗺️' },
    { id: 'review', label: 'Review', icon: '🧠' },
    { id: 'sheet', label: 'Sheet', icon: '🖋️' },
    { id: 'progress', label: 'Progress', icon: '📊' },
    { id: 'build', label: 'Build', icon: '🧩' },
  ];
  const navActive = 'path';

  const NavPill = ({ item }) => (
    <button type="button"
      style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', padding: '0.5rem 0.95rem',
               borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-ui)', fontSize: 'var(--fs-small)',
               border: 'none', transition: 'all var(--dur-fast) var(--ease)',
               background: navActive === item.id ? 'var(--bg-elevated)' : 'transparent',
               color: navActive === item.id ? 'var(--text-primary)' : 'var(--text-secondary)' }}>
      <span>{item.icon}</span><span>{item.label}</span>
    </button>
  );

  return (
    <div style={{ minHeight: '100vh', ...THEMES[theme].vars, background: 'var(--bg-primary)', color: 'var(--text-primary)',
                  transition: 'background var(--dur-base) var(--ease)' }}>
      <div className="cc-bar" style={{ position: 'sticky', top: 0, zIndex: 20, display: 'flex', alignItems: 'center',
                    background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', minWidth: 0 }}>
          <span style={{ fontSize: '1.4rem' }}>✍️</span>
          <span style={{ fontWeight: 700, fontSize: 'var(--fs-lg)', whiteSpace: 'nowrap',
                         background: 'var(--gradient-display)', WebkitBackgroundClip: 'text', backgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Scriptura</span>
        </div>
        <div className="cc-flex-desktop" style={{ gap: '0.25rem', background: 'var(--bg-primary)', padding: 4, borderRadius: 'var(--radius-pill)', border: '1px solid var(--border-color)' }}>
          {navItems.map((it) => <NavPill key={it.id} item={it} />)}
        </div>
        <div style={{ flex: 1 }} />
        <button type="button" title="Tamil"
          style={{ display: 'inline-flex', alignItems: 'center', gap: '0.45rem', padding: '0.4rem 0.85rem',
                   background: 'var(--bg-primary)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-pill)',
                   cursor: 'pointer', color: 'var(--text-primary)', fontFamily: 'var(--font-ui)', fontSize: 'var(--fs-small)' }}>
          <span style={{ fontFamily: TAM, fontSize: '1.1rem', lineHeight: 1 }}>🪷</span>
          <span className="cc-inline-desktop">Tamil</span>
        </button>
        <span className="cc-streak" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.35rem',
                       background: 'var(--bg-primary)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-pill)', fontSize: 'var(--fs-small)' }}>
          🔥 <b style={{ color: 'var(--accent-review)' }}>7</b></span>
        <button type="button" title="Switch theme" className="cc-flex-mobile"
          onClick={() => { const ks = Object.keys(THEMES); setTheme(ks[(ks.indexOf(theme) + 1) % ks.length]); }}
          style={{ width: 34, height: 34, flex: 'none', alignItems: 'center', justifyContent: 'center',
                   borderRadius: 'var(--radius-md)', cursor: 'pointer', fontSize: '1rem',
                   background: 'var(--bg-primary)', border: '1px solid var(--border-color)' }}>{THEMES[theme].icon}</button>
        <div className="cc-flex-desktop" style={{ gap: 4 }}>
          {Object.entries(THEMES).map(([k, t]) => (
            <button key={k} type="button" title={t.label} onClick={() => setTheme(k)}
              style={{ width: 34, height: 34, borderRadius: 'var(--radius-md)', cursor: 'pointer', fontSize: '1rem',
                       background: theme === k ? 'var(--bg-elevated)' : 'transparent',
                       border: `1px solid ${theme === k ? 'var(--text-secondary)' : 'var(--border-color)'}` }}>{t.icon}</button>
          ))}
        </div>
      </div>

      <div className="cc-content" style={{ maxWidth: 920, margin: '0 auto' }}>
        <Lesson />
      </div>

      <div className="cc-flex-mobile" style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 30,
                    background: 'var(--bg-secondary)', borderTop: '1px solid var(--border-color)' }}>
        {navItems.map((it) => (
          <button key={it.id} type="button"
            style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, minWidth: 0,
                     padding: '0.5rem 0 0.55rem', background: 'transparent', border: 'none', cursor: 'pointer',
                     color: navActive === it.id ? 'var(--text-primary)' : 'var(--text-muted)',
                     fontFamily: 'var(--font-ui)', fontSize: '0.65rem' }}>
            <span style={{ fontSize: '1.15rem', lineHeight: 1, opacity: navActive === it.id ? 1 : 0.55 }}>{it.icon}</span>
            <span style={{ fontWeight: navActive === it.id ? 700 : 500 }}>{it.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

function mount() {
  if (!window.ScripturaDesignSystem_72b484) return setTimeout(mount, 30);
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
mount();
</script>
</body>
</html>
