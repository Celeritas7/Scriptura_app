  .sheet-grid { grid-template-columns: repeat(5, 1fr); }
  .sheet-cell, .sheet-blank { min-height: 140px; }

  .sheet-cell:hover { box-shadow: inset 0 0 0 2px rgba(0,0,0,0.10); }
  /* Cell tools. Clear is destructive and hides until hover on precise pointers;
     Check is the affordance the header tells users to tap, so it is always
     visible. On touch both are always shown at a 44px target. */
  .sheet-clear { width: 26px; height: 26px; opacity: 0; transition: opacity .15s var(--ease); }
  .sheet-cell:hover .sheet-clear { opacity: 1; }
  .sheet-check { height: 26px; padding: 0 10px; }
  .sheet-mastery { min-width: 26px; height: 26px; padding: 0 6px; font-size: 12px; }
  @media (pointer: coarse) {

  @media (max-width: 470px) { .sheet-grid { grid-template-columns: repeat(2, 1fr); } .sheet-cell { min-height: 200px; } .sheet-ghost { font-size: 5.2rem; }
    .sheet-focus-row { grid-template-columns: repeat(2, 1fr); } .sheet-focus-row .sheet-cell { min-height: min(34vh, 240px); } }
  /* app chrome breakpoints are CSS-only: resolved at layout, no JS callback needed */
  .cc-flex-desktop { display: flex; } .cc-inline-desktop { display: inline; }
  .cc-flex-mobile { display: none; }
  .cc-bar { gap: var(--space-5); padding: var(--space-4) var(--space-6); flex-wrap: wrap; }

  /* horizontal strips: wrap on wide screens; on narrow screens scroll with no scrollbar and a fade at the trailing edge */
  .hscroll { flex-wrap: wrap; overflow-x: visible; }
  @media (max-width: 900px) {
    .hscroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
      mask-image: linear-gradient(90deg, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); }
    .hscroll::-webkit-scrollbar { display: none; }
  }
  /* dashboard: main column + grouped script rail */
  .dash-grid { display: grid; gap: var(--space-6); grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
  .dash-stats { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .dash-tools { display: grid; gap: var(--space-4); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .dash-scripts { display: flex; flex-direction: column; gap: var(--space-5); }
  .dash-dock { display: none; }
  .dash-dock-sheet { display: none; }
  .touch-only { display: none !important; }
  @media (pointer: coarse) { .touch-only { display: flex !important; } }
  .dash-group-items { display: flex; flex-direction: column; gap: 6px; }
  @media (max-width: 900px) {
    .dash-grid { grid-template-columns: minmax(0, 1fr); }
    .dash-dock { display: block; position: fixed; left: 0; right: 0; z-index: 120; padding: 10px 14px 12px;
      bottom: calc(70px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(10,10,15,0), rgba(10,10,15,.94) 40%, var(--bg-primary)); }
    .dash-dock-sheet { display: block; }
    .dash-grid { padding-bottom: 84px; }
    .dash-rail { display: none; }
    .dash-group-items { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; gap: var(--space-3);
      mask-image: linear-gradient(90deg, #000 88%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); }
    .dash-group-items::-webkit-scrollbar { display: none; }
    .dash-group-items > button { min-width: 200px; }
  }
  @media (max-width: 560px) { .dash-stats, .dash-tools { grid-template-columns: minmax(0, 1fr); } }
  /* 900–1100px: nav pills go icon-only so the bar stays on one row */
  @media (max-width: 1100px) { .cc-nav-label { display: none; } }
  @media (max-width: 900px) {
    .cc-flex-desktop, .cc-inline-desktop { display: none; }
    .cc-flex-mobile { display: flex; }
    .cc-bar { gap: var(--space-3); padding: var(--space-3) var(--space-4); flex-wrap: nowrap; }
    .cc-content { padding: var(--space-5) var(--space-4) calc(70px + env(safe-area-inset-bottom) + var(--space-6)); }
    .cc-streak { padding: 0.4rem 0.6rem; }
  }
  @media print {
    body * { visibility: hidden !important; }
    #sheetPrintArea, #sheetPrintArea * { visibility: visible !important; }
    #sheetPrintArea { position: absolute; left: 0; top: 0; width: 100%; }
    .sheet-noprint { display: none !important; }
    /* paper is one column of the canonical 5-wide grid, blanks restored so the
       varga columns line up; each unit starts its own page */
    @page { margin: 12mm; }
    .sheet-grid { grid-template-columns: repeat(5, 1fr) !important; }
    .sheet-blank { display: block !important; }
    .sheet-cell, .sheet-blank { min-height: 27mm !important; }
    .sheet-cell canvas { display: none !important; }
    .sheet-unit { break-inside: auto; break-before: page; page-break-before: always; }
    .sheet-unit:first-child { break-before: auto; page-break-before: avoid; }
    .sheet-unit-head { break-after: avoid; page-break-after: avoid;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .sheet-cell, .sheet-blank { break-inside: avoid; page-break-inside: avoid; }
  }
</style>

<script type="text/babel" data-presets="react">
  const D = window.ScripturaData;

  const THEMES = {
    midnight: { icon: '🌙', label: 'Midnight', vars: {} },
    dusk: { icon: '🌆', label: 'Dusk', vars: {
      '--bg-primary': '#13131b', '--bg-secondary': '#1c1c28', '--bg-card': '#242433',
      '--bg-elevated': '#2e2e40', '--border-color': '#34344a' } },
    daylight: { icon: '☀️', label: 'Daylight', vars: {
      '--bg-primary': '#f1f2f7', '--bg-secondary': '#ffffff', '--bg-card': '#ffffff',
      '--bg-elevated': '#eceef5', '--border-color': '#e2e3ee',
      '--text-primary': '#1a1a25', '--text-secondary': '#5a5a72', '--text-muted': '#9a9ab0',
      '--shadow-card': '0 4px 18px rgba(20,20,40,0.10)' } },
  };

  function App() {
    const [theme, setTheme] = React.useState('midnight');
    const [langId, setLangId] = React.useState(D.defaultLang);
    const [route, setRoute] = React.useState({ screen: 'home' });
    const [learnedByLang, setLearnedByLang] = React.useState(() => {
      const m = {}; Object.keys(D.languages).forEach((id) => { m[id] = new Set((D.seed && D.seed[id]) || []); }); return m;
    });
    const [profile, setProfile] = React.useState(() => ({ ...D.profile }));
    const lang = D.languages[langId];
    const learned = learnedByLang[langId];
    // Review queue comes from the Leitner boxes (localStorage), falling back to
    // the seeded `srs: 'due'` characters until the learner has any real history.
    const [srsRev, setSrsRev] = React.useState(0);
    const queue = React.useMemo(() => {
      const S = window.ScripturaSRS;
      if (!S) return lang.dueChars;
      S.migrateFrom(langId, window.ProgressStore.load(langId));
      const idx = S.dueList(langId, lang.allChars.length);
      // carry the language-wide index on each card so grading can write back
      if (idx.length) return idx.map((i) => (lang.allChars[i] ? { ...lang.allChars[i], _i: i, font: lang.allChars[i].font || lang.font } : null)).filter(Boolean);
      // The seeded `srs: 'due'` characters are a demo queue for a language the
      // learner has never touched. Gate on ABSENCE OF HISTORY, not on "nothing
      // due" — otherwise a real schedule with nothing due today gets replaced by
      // demo cards, inflating the due count and grading characters the
      // scheduler deliberately pushed out.
      const hasHistory = Object.keys(S.load(langId)).length > 0;
      if (hasHistory) return [];
      return lang.dueChars.map((c) => ({ ...c, _i: lang.allChars.indexOf(c) }));
    }, [lang, langId, srsRev]);
    // Flashcard deck: every character, shuffled once per language visit
    const flashDeck = React.useMemo(() => {
      const d = lang.allChars.map((c, i) => ({ ...c, _i: i, font: c.font || lang.font }));
      for (let k = d.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [d[k], d[j]] = [d[j], d[k]]; }
      return d;
    }, [lang, route.screen === 'flashcards']);

    const activeUnitId = React.useMemo(() => {
      const u = lang.units.find((u) => !u.chars.every((c) => learned.has(c.char)));
      return (u || lang.units[lang.units.length - 1]).id;
    }, [lang, learned]);

    const addXp = (xp) => setProfile((p) => ({ ...p, todayXp: p.todayXp + xp, levelXp: Math.min(p.levelMax, p.levelXp + xp) }));

    const go = (r) => setRoute(r);

    const finishLesson = (chars, xp) => {
      setLearnedByLang((prev) => { const n = new Set(prev[langId]); chars.forEach((c) => n.add(c)); return { ...prev, [langId]: n }; });
      addXp(xp);
      setSrsRev((r) => r + 1); // lesson graded into the Leitner boxes
      setRoute({ screen: 'path' });
    };

    const switchLang = (id) => { setLangId(id); setRoute({ screen: 'home' }); pullStats(id); };

    // --- cloud: pull accumulated stats for a language and merge locally ---
    const [cloudStatus, setCloudStatus] = React.useState('off');
    const pullStats = React.useCallback((id) => {
      if (!(window.ScripturaCloud && window.ScripturaCloud.isConfigured())) { setCloudStatus('off'); return; }
      window.ScripturaCloud.loadStats(id).then((m) => {
        if (m) { window.ProgressStore.merge(id, m); setCloudStatus('on'); }
        else setCloudStatus('error');
      }).catch(() => setCloudStatus('error'));
    }, []);
    React.useEffect(() => { pullStats(langId); }, []); // eslint-disable-line

    const onCloud = (action, id) => {
      if (action === 'configured') { setCloudStatus('on'); pullStats(id); }
      else if (action === 'pull') pullStats(id);
    };

    const { Button } = window.ScripturaDesignSystem_72b484;

    // --- top bar ---
    const navItems = [
      { id: 'home', label: 'Home', icon: 'home' },
      { id: 'path', label: 'Path', icon: 'map' },
      { id: 'review', label: 'Review', icon: 'review' },
      { id: 'sheet', label: 'Sheet', icon: 'pen' },
      { id: 'progress', label: 'Progress', icon: 'chart' },
      { id: 'build', label: 'Build', icon: 'build' },
    ];
    const navActive = { home: 'home', path: 'path', lesson: 'path', review: 'review', flashcards: 'review', sheet: 'sheet', progress: 'progress', build: 'build' }[route.screen];
    // Lesson and Review own the whole viewport — their own ✕ + progress row is enough chrome.
    const immersive = route.screen === 'lesson' || route.screen === 'review' || route.screen === 'flashcards';
    const tabItems = navItems.filter((i) => ['home', 'path', 'review', 'progress'].includes(i.id));

    const NavPill = ({ item }) => (
      <button type="button" onClick={() => go({ screen: item.id })}
        style={{ display: 'inline-flex', alignItems: 'center', gap: '0.4rem', padding: '0.5rem 0.95rem',
                 borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-ui)', fontSize: 'var(--fs-small)',
                 border: 'none', transition: 'all var(--dur-fast) var(--ease)',
                 background: navActive === item.id ? 'var(--bg-elevated)' : 'transparent',
                 color: navActive === item.id ? 'var(--text-primary)' : 'var(--text-secondary)' }}>
        <span><window.Icon name={item.icon} size={16} /></span><span className="cc-nav-label">{item.label}</span>
      </button>
    );

    let body;
    if (route.screen === 'home') body = <window.Dashboard profile={profile} units={lang.units} learned={learned} activeUnitId={activeUnitId} dueCount={queue.length} onGo={go} theme={D.themes[langId]} lang={lang} languageList={D.languageList} themes={D.themes} currentLang={langId} onPick={switchLang} />;
    else if (route.screen === 'path') body = <window.LessonPath units={lang.units} learned={learned} activeUnitId={activeUnitId} langName={lang.name} theme={D.themes[langId]} onGo={go} />;
    else if (route.screen === 'lesson') {
      const unit = lang.units.find((u) => u.id === route.unitId);
      body = <window.LessonView unit={unit} learned={learned} xpPerCard={profile.xpPerCard} langId={langId}
                onComplete={finishLesson} onExit={() => go({ screen: 'path' })} />;
    }
    else if (route.screen === 'review') body = <window.ReviewSession queue={queue} xpPerCard={profile.xpPerCard} langId={langId} allChars={lang.allChars} onGo={go}
                onExit={() => go({ screen: 'home' })} onComplete={(xp) => { addXp(xp); setSrsRev((r) => r + 1); go({ screen: 'home' }); }} />;
    // Flashcards: every character, shuffled, practice only (never touches the schedule)
    else if (route.screen === 'flashcards') body = <window.ReviewSession key={'fc' + langId} mode="practice" langId={langId} allChars={lang.allChars}
                queue={flashDeck} onExit={() => go({ screen: 'home' })} onComplete={() => go({ screen: 'home' })} />;
    else if (route.screen === 'build') body = <window.WordBuilder lang={lang} />;
    else if (route.screen === 'sheet') body = <window.PracticeSheet lang={lang} theme={D.themes[langId]} onSaved={(s) => { setCloudStatus(s); setSrsRev((r) => r + 1); }} />;
    else if (route.screen === 'progress') body = <window.ProgressScreen lang={lang} theme={D.themes[langId]} cloudStatus={cloudStatus} onCloud={onCloud} onGo={go} key={'pr' + srsRev} />;

    const themeVars = THEMES[theme].vars;

    return (
      <div style={{ minHeight: '100vh', ...themeVars, background: 'var(--bg-primary)', color: 'var(--text-primary)',
                    transition: 'background var(--dur-base) var(--ease)' }}>
        {/* APP BAR */}
        {!immersive && (
        <div className="cc-bar" style={{ position: 'sticky', top: 0, zIndex: 20, display: 'flex', alignItems: 'center',
                      background: 'var(--bg-secondary)', borderBottom: '1px solid var(--border-color)' }}>
          <div onClick={() => go({ screen: 'home' })} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', cursor: 'pointer', minWidth: 0 }}>
            <span style={{ width: 28, height: 28, borderRadius: 8, display: 'grid', placeItems: 'center', background: 'var(--gradient-display)', color: '#fff' }}><window.Icon name="pen" size={15} /></span>
            <span style={{ fontWeight: 700, fontSize: 'var(--fs-lg)', whiteSpace: 'nowrap',
                           background: 'var(--gradient-display)', WebkitBackgroundClip: 'text', backgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Scriptura</span>
          </div>
          <div className="cc-flex-desktop" style={{ gap: '0.25rem', background: 'var(--bg-primary)', padding: 4, borderRadius: 'var(--radius-pill)', border: '1px solid var(--border-color)' }}>
            {navItems.map((it) => <NavPill key={it.id} item={it} />)}
          </div>
          <div style={{ flex: 1 }} />
          <button type="button" onClick={() => go({ screen: 'home' })} title={lang.name}
            style={{ display: 'inline-flex', alignItems: 'center', gap: '0.45rem', padding: '0.4rem 0.85rem',
                     background: 'var(--bg-primary)',
                     border: '1px solid var(--border-color)', borderRadius: 'var(--radius-pill)', cursor: 'pointer',
                     color: 'var(--text-primary)', fontFamily: 'var(--font-ui)', fontSize: 'var(--fs-small)' }}>
            <span style={{ fontFamily: lang.font, fontSize: '1.1rem', lineHeight: 1 }}>{(D.themes[langId] && D.themes[langId].emblem) || lang.native.slice(0, 1)}</span>
            <span className="cc-inline-desktop">{lang.name}</span>
          </button>
          <span className="cc-streak" style={{ display: 'inline-flex', alignItems: 'center', gap: '0.35rem',
                         background: 'var(--bg-primary)', border: '1px solid var(--border-color)', borderRadius: 'var(--radius-pill)', fontSize: 'var(--fs-small)' }}>
            <window.Icon name="flame" size={15} style={{ color: 'var(--accent-review)' }} /> <b style={{ color: 'var(--accent-review)' }}>{profile.streak}</b></span>
          <button type="button" title="Switch theme" className="cc-flex-mobile"
            onClick={() => { const ks = Object.keys(THEMES); setTheme(ks[(ks.indexOf(theme) + 1) % ks.length]); }}
            style={{ width: 34, height: 34, flex: 'none', alignItems: 'center', justifyContent: 'center',
                     borderRadius: 'var(--radius-md)', cursor: 'pointer', fontSize: '1rem',
                     background: 'var(--bg-primary)', border: '1px solid var(--border-color)' }}>{THEMES[theme].icon}</button>
          <div className="cc-flex-desktop" style={{ gap: 4 }}>
            {Object.entries(THEMES).map(([k, t]) => (
              <button key={k} type="button" title={t.label} onClick={() => setTheme(k)}
                style={{ width: 34, height: 34, borderRadius: 'var(--radius-md)', cursor: 'pointer', fontSize: '1rem',
                         background: theme === k ? 'var(--bg-elevated)' : 'transparent',
                         border: `1px solid ${theme === k ? 'var(--text-secondary)' : 'var(--border-color)'}` }}>{t.icon}</button>
            ))}
          </div>
        </div>
        )}

        {/* CONTENT */}
        <div className="cc-content" style={{ maxWidth: 920, margin: '0 auto' }}>
          {body}
        </div>

        {/* BOTTOM TAB BAR (mobile) */}
        {!immersive && (
        <div className="cc-flex-mobile" style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 30,
                      background: 'var(--bg-secondary)', borderTop: '1px solid var(--border-color)',
                      paddingBottom: 'env(safe-area-inset-bottom)' }}>
          {tabItems.map((it) => (
            <button key={it.id} type="button" onClick={() => go({ screen: it.id })}
              style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2, minWidth: 0,
                       padding: '0.5rem 0 0.55rem', background: 'transparent', border: 'none', cursor: 'pointer',
                       color: navActive === it.id ? 'var(--text-primary)' : 'var(--text-muted)',
                       fontFamily: 'var(--font-ui)', fontSize: '0.65rem' }}>
              <span style={{ lineHeight: 1, opacity: navActive === it.id ? 1 : 0.55, display: 'grid', placeItems: 'center' }}><window.Icon name={it.icon} size={20} /></span>
              <span style={{ fontWeight: navActive === it.id ? 700 : 500 }}>{it.label}</span>
            </button>
          ))}
        </div>
        )}
      </div>
    );
  }

  // Optionally load content (languages/units/characters/vowels) from Supabase,
  // falling back to the built-in data.js if offline or the fetch fails.
  async function boot() {
    try {
      if (window.ScripturaCloud && window.ScripturaCloud.isConfigured()) {
        const content = await Promise.race([
          window.ScripturaCloud.loadContent(),
          new Promise((r) => setTimeout(() => r(null), 6000)),
        ]);
        if (content && content.languageList && content.languageList.length) {
          // data.js is authoritative for the scripts it ships (character
          // inventories & their order live in source control); the cloud adds
          // any language the bundle doesn't know about yet.
          const local = window.ScripturaData.languages;
          const merged = { ...content.languages };
          Object.keys(local).forEach((id) => { merged[id] = local[id]; });
          const seen = {};
          const list = window.ScripturaData.languageList
            .concat(content.languageList.filter((l) => !local[l.id]))
            .filter((l) => (seen[l.id] ? false : (seen[l.id] = true)));
          window.ScripturaData.languages = merged;
          window.ScripturaData.languageList = list;
          window.ScripturaData.__source = 'supabase+local';
        }
      }
    } catch (e) { /* keep built-in data */ }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  }

  function mount() {
    const need = ['Dashboard','LessonPath','LessonView','ReviewSession','WordBuilder','PracticeSheet','ProgressScreen','DrawCanvas','Ring','StrokeGlyph','Flashcard','LessonNode','Icon'];
    if (!window.ScripturaDesignSystem_72b484 || need.some((n) => !window[n])) return setTimeout(mount, 30);
    boot();
  }
  mount();
</script>
