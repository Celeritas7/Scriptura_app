<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0}
body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--bg-primary);display:flex;align-items:center;justify-content:center}
.name{font-family:var(--font-display,var(--font-ui,sans-serif));font-weight:700;font-size:170px;white-space:nowrap;background:linear-gradient(90deg,#22c55e,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#3b82f6}
.strip{width:150px;height:854px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="main"><span class="name">Scriptura</span></div>
<div class="strip"><div style="background:#f59e0b"></div><div style="background:#22c55e"></div><div style="background:#3b82f6"></div><div style="background:#8b5cf6"></div></div>
</body>
</html>
